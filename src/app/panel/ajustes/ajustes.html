<section class="ajustes-container">
  <h3>Ajustes de Cuenta</h3>

  @if (mensaje()) {
    <div class="mensaje" [class.error]="tipoMensaje() === 'error'" [class.success]="tipoMensaje() === 'success'">
      {{ mensaje() }}
    </div>
  }

  <div class="ajuste-section">
    <h4>Cambiar Correo Electrónico</h4>
    <div class="form-group">
      <label for="lint-associated-field-1">Correo electrónico</label>
      <input type="email" [(ngModel)]="email" placeholder="tu@email.com"  id="lint-associated-field-1"/>
    </div>
    <div class="form-group">
      <label for="lint-associated-field-2">Contraseña actual *</label>
      <input type="password" [(ngModel)]="emailPassword" placeholder="Ingresa tu contraseña actual"  id="lint-associated-field-2"/>
    </div>
    <button class="btn-guardar" (click)="guardarEmail()" [disabled]="guardando()">
      {{ guardando() ? 'Guardando...' : 'Actualizar Correo' }}
    </button>
  </div>

  <div class="ajuste-section">
    <h4>Cambiar Contraseña</h4>
    <div class="form-group">
      <label for="lint-associated-field-3">Contraseña actual *</label>
      <input type="password" [(ngModel)]="currentPassword" placeholder="Ingresa tu contraseña actual"  id="lint-associated-field-3"/>
    </div>
    <div class="form-group">
      <label for="lint-associated-field-4">Nueva contraseña *</label>
      <input type="password" [(ngModel)]="newPassword" placeholder="Mínimo 6 caracteres"  id="lint-associated-field-4"/>
    </div>
    <div class="form-group">
      <label for="lint-associated-field-5">Confirmar nueva contraseña *</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Repite la nueva contraseña"  id="lint-associated-field-5"/>
    </div>
    <button class="btn-guardar" (click)="cambiarContrasena()" [disabled]="guardando()">
      {{ guardando() ? 'Guardando...' : 'Cambiar Contraseña' }}
    </button>
  </div>
</section>
