@if (esSitioBloqueado) {
  <div class="maintenance-overlay">
    <div class="maintenance-container">
      <img src="/mantenimiento.jpg" alt="Página en mantenimiento" class="maintenance-image">
    </div>
  </div>
} @else {
  @if (mostrarModal) {
    <div class="maintenance-overlay" (click)="($event.target === $event.currentTarget) && (dismissModal())" tabindex="0" (keydown.enter)="dismissModal()" (keydown.space)="dismissModal(); $event.preventDefault()">
      <div class="maintenance-container">
        <img src="/mantenimiento.jpg" alt="Página en mantenimiento" class="maintenance-image">
        <button class="continue-btn" (click)="dismissModal()">Continuar</button>
      </div>
    </div>
  }

<div class="flex flex-col min-h-screen">
    <app-header />
    <app-notifications />
    <app-notification-modal />
    <main>
      <router-outlet />
    </main>
    <app-footer />
  </div>
}
