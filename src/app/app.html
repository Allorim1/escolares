@if (esSitioBloqueado) {
  <div class="maintenance-overlay">
    <div class="maintenance-container">
      <img src="/mantenimiento.jpg" alt="Página en mantenimiento" class="maintenance-image">
    </div>
  </div>
} @else {
  @if (mostrarModal) {
    <div class="maintenance-overlay" (click)="($event.target === $event.currentTarget) && (dismissModal())" tabindex="0" (keydown.enter)="dismissModal()" (keydown.space)="dismissModal(); $event.preventDefault()">
      <div class="maintenance-container">
        <img src="/mantenimiento.jpg" alt="Página en mantenimiento" class="maintenance-image">
        <button class="continue-btn" (click)="dismissModal()">Continuar</button>
      </div>
    </div>
  }

<div class="app-shell flex flex-col min-h-screen" [class.has-mobile-nav]="!isAdminRoute">
    <app-header />
    <app-notifications />
    <app-notification-modal />
    <main>
      <router-outlet />
    </main>
    <app-footer />
    @if (!isAdminRoute) {
      <nav class="mobile-bottom-nav" aria-label="Navegación rápida">
        <a routerLink="/" [attr.aria-current]="isHomeRoute ? 'page' : null">
          <span aria-hidden="true">⌂</span>
          Inicio
        </a>
        <a routerLink="/products">
          <span aria-hidden="true">▦</span>
          Catálogo
        </a>
        <a routerLink="/cart">
          <span aria-hidden="true">🛒</span>
          Carrito
        </a>
      </nav>
    }
  </div>
}
