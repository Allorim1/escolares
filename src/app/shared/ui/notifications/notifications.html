<div class="notifications-container" aria-live="polite" aria-atomic="false">
  @for (notification of notificationService.notifications; track notification.id) {
    @if (notification.url) {
      <button type="button" class="notification notification-{{ notification.type }} clickable"
              (click)="navigateToNews(notification.url)">
        @if (notification.icon) {
          <span class="notification-icon" aria-hidden="true">{{ notification.icon }}</span>
        }
        <div class="notification-content">
          <div class="notification-title">{{ notification.title }}</div>
          @if (notification.message) {
            <div class="notification-message">{{ notification.message }}</div>
          }
        </div>
      </button>
    } @else {
      <div class="notification notification-{{ notification.type }}">
        @if (notification.icon) {
          <span class="notification-icon" aria-hidden="true">{{ notification.icon }}</span>
        }
        <div class="notification-content">
          <div class="notification-title">{{ notification.title }}</div>
          <div class="notification-message">{{ notification.message }}</div>
          @if (notification.imageUrl) {
            <img [src]="notification.imageUrl" class="notification-image" alt="Producto" />
          }
        </div>
        <button class="notification-close" (click)="notificationService.remove(notification.id); $event.stopPropagation()" aria-label="Cerrar notificación">×</button>
      </div>
    }
  }
</div>
